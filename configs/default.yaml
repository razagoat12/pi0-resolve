# Default configuration. Every value traces back to docs/decisions.md.
# Units (D-12): energy and momentum in GeV, length in cm, angles in rad.

seed: 20261006                      # D-11: every run sets and logs its seed

# Coordinates (D-15): z along the beam, target centred at the origin,
# array centre at distance L and angle theta in the x-z plane.

beam:                               # D-01, D-15
  particle: proton
  momentum_gev: 8.0
  spot_sigma_cm: 0.5                # Gaussian; BL4S "about 2 cm" read as +-2 sigma

pi0:                                # D-02, D-03, D-15
  spectrum: toy                     # Phase 1 only; results use HARP-based spectra
  energy_min_gev: 0.5
  energy_max_gev: 5.0
  energy_bin_gev: 0.25
  toy:                              # placeholder physics spectrum, replaced by HARP
    momentum_slope_gev: 1.0         # dN/dp ~ exp(-p / slope)
    pt_temperature_gev: 0.17        # dN/dpT ~ pT exp(-pT / T), <pT> = 2T
  flat:                             # classifier samples: uniform energy, aimed at the array
    aim_margin_rad: 0.10            # added to the angle subtended by the array half-diagonal

targets:                            # D-04 (properties from PDG), D-16
  thickness_fractions_lambda_i: [0.02, 0.05]
  transverse_size_cm: 5.0           # square face, centred on the beam
  materials:
    carbon: { density_g_cm3: 2.21, x0_cm: 19.32, lambda_i_cm: 38.83 }
    copper: { density_g_cm3: 8.96, x0_cm: 1.436, lambda_i_cm: 15.32 }
    tin:    { density_g_cm3: 7.31, x0_cm: 1.206, lambda_i_cm: 22.80 }

geometry:                           # D-05
  distance_cm: 150.0                # target to array face
  angle_rad: 0.20944                # 12 degrees from the beam axis
  blocks_per_side: 4
  block_size_cm: 10.0
  block_depth_cm: 37.0

transport:                          # D-16 (radiation lengths from PDG)
  air_x0_cm: 30390.0                # dry air, 1 atm
  veto_thickness_cm: 1.0            # plastic scintillator directly in front of the array
  veto_x0_cm: 42.54                 # polyvinyltoluene

detector:                           # D-07
  resolution_stochastic: 0.063      # sigma_E/E = constant + stochastic/sqrt(E)
  resolution_constant: 0.0002
  noise_gev: 0.010
  threshold_noise_sigmas: 3.0
  gain_error: 0.0

shower:                             # D-06 (glass type assumed SF57 until BL4S confirms)
  model: double_gaussian
  moliere_radius_cm: 2.6
  # TODO (detector step): core/halo widths and fractions, shape fluctuations

clustering:                         # D-08
  seed_threshold_gev: 0.100
  window_blocks: 3
