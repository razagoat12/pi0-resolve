[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi0resolve"
version = "0.1.0"
description = "Monte Carlo and machine-learning study of neutral-pion reconstruction in a coarse lead-glass calorimeter"
readme = "README.md"
license = "MIT"
authors = [{ name = "Beam Optimizers" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7"]
ml = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
