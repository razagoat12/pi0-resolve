  <rect x="542" y="330" width="56" height="56" rx="5" fill="#181F41" stroke="#2E3D70"/>
  <rect x="602" y="330" width="56" height="56" rx="5" fill="#652286" stroke="#2E3D70"/>
  <rect x="662" y="330" width="56" height="56" rx="5" fill="#FCA946" stroke="#2E3D70"/>
  <text x="690" y="362" text-anchor="middle" class="mono" font-size="12" fill="#1A1030">0.40</text>
  <path d="M512 191 h10 M517 186 v10" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9"/>
  <path d="M674 347 h10 M679 342 v10" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9"/>
  <text x="600" y="412" text-anchor="middle" class="sans" font-size="13" fill="#8A97B4">two clusters · m(γγ) can be rebuilt</text>
  <text x="600" y="436" text-anchor="middle" class="mono" font-size="12" fill="#5F6B8A">E = 1.1 GeV · L = 1.5 m · values in GeV</text>
  <!-- panel: merged -->
  <rect x="800" y="100" width="360" height="360" rx="14" fill="#111933" stroke="#22305A"/>
  <circle cx="824" cy="127" r="4" fill="#FF8CC6"/>
  <text x="836" y="132" class="sans" font-size="16" font-weight="600" fill="#E6EDF7">Merged π⁰ · higher energy</text>
