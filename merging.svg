  <rect x="982" y="270" width="56" height="56" rx="5" fill="#F97F25" stroke="#2E3D70"/>
  <text x="1010" y="302" text-anchor="middle" class="mono" font-size="12" fill="#1A1030">1.30</text>
  <rect x="1042" y="270" width="56" height="56" rx="5" fill="#32266E" stroke="#2E3D70"/>
  <rect x="862" y="330" width="56" height="56" rx="5" fill="#161E3C" stroke="#2E3D70"/>
  <rect x="922" y="330" width="56" height="56" rx="5" fill="#1D214C" stroke="#2E3D70"/>
  <rect x="982" y="330" width="56" height="56" rx="5" fill="#222356" stroke="#2E3D70"/>
  <rect x="1042" y="330" width="56" height="56" rx="5" fill="#191F43" stroke="#2E3D70"/>
  <path d="M958 254 h10 M963 249 v10" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9"/>
  <path d="M1003 272 h10 M1008 267 v10" stroke="#FFFFFF" stroke-width="1.6" opacity="0.9"/>
  <text x="980" y="412" text-anchor="middle" class="sans" font-size="13" fill="#8A97B4">one cluster · mimics a photon → ML task</text>
  <text x="980" y="436" text-anchor="middle" class="mono" font-size="12" fill="#5F6B8A">E = 5.2 GeV · L = 1.5 m · values in GeV</text>
  <!-- energy axis (spans the two π⁰ panels) -->
  <linearGradient id="axis2" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="1160" y2="0">
    <stop offset="0" stop-color="#4CC9F0"/>
    <stop offset="0.5" stop-color="#7B61FF"/>
    <stop offset="1" stop-color="#F72585"/>
  </linearGradient>
  <line x1="420" y1="500" x2="1156" y2="500" stroke="url(#axis2)" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="420" y1="492" x2="420" y2="508" stroke="#5F6B8A"/>
  <line x1="660" y1="492" x2="660" y2="508" stroke="#5F6B8A"/>
  <line x1="960" y1="492" x2="960" y2="508" stroke="#5F6B8A"/>
  <text x="540" y="486" text-anchor="middle" class="sans" font-size="13" fill="#8FDDF7">two separate clusters</text>
  <text x="810" y="486" text-anchor="middle" class="sans" font-size="13" fill="#B9A8FF">neighbouring blocks: ML vs width cut?</text>
  <text x="1058" y="486" text-anchor="middle" class="sans" font-size="13" fill="#FF8CC6">same block: info limit</text>
  <text x="1156" y="530" text-anchor="end" class="mono" font-size="12" fill="#8A97B4">π⁰ energy</text>

  <!-- legend -->
  <g>
    <text x="40" y="504" class="mono" font-size="11" fill="#5F6B8A">energy share</text>
