<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">The merging problem</title>
  <desc id="d">Simulated energy deposits in the 4×4 lead-glass array for a single photon, a lower-energy neutral pion whose two photons form separate clusters, and a higher-energy neutral pion whose photons merge into one cluster that mimics a single photon.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C9D4F0" opacity="0.06"/>
    </pattern>
    <linearGradient id="axis" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#F72585"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141D38"/>
      <stop offset="0.06" stop-color="#2B276B"/>
      <stop offset="0.25" stop-color="#8E1E9A"/>
      <stop offset="0.6" stop-color="#F76B15"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F72585"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#0C1226" stroke="#1F2A4A"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="url(#dots)"/>

  <text x="40" y="48" class="mono" font-size="12" letter-spacing="3" fill="#4CC9F0">THE MERGING PROBLEM · CALORIMETER FRONT VIEW</text>
  <text x="40" y="76" class="sans" font-size="20" font-weight="600" fill="#E6EDF7">As π⁰ energy rises, its two photons collapse into one cluster</text>
  <text x="1160" y="76" text-anchor="end" class="mono" font-size="16" font-weight="700" fill="#FFD166">d ≈ L · m<tspan font-size="11" dy="4">π⁰</tspan><tspan dy="-4"> / √(E₁E₂)</tspan></text>
  <!-- panel: single -->
  <rect x="40" y="100" width="360" height="360" rx="14" fill="#111933" stroke="#22305A"/>
  <circle cx="64" cy="127" r="4" fill="#8FDDF7"/>
  <text x="76" y="132" class="sans" font-size="16" font-weight="600" fill="#E6EDF7">Single photon</text>
  <rect x="102" y="150" width="56" height="56" rx="5" fill="#161E3C" stroke="#2E3D70"/>
  <rect x="162" y="150" width="56" height="56" rx="5" fill="#191F43" stroke="#2E3D70"/>
  <rect x="222" y="150" width="56" height="56" rx="5" fill="#161E3E" stroke="#2E3D70"/>
  <rect x="282" y="150" width="56" height="56" rx="5" fill="#141D38" stroke="#2E3D70"/>
