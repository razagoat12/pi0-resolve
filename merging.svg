  <text x="190" y="302" text-anchor="middle" class="mono" font-size="12" fill="#1A1030">2.06</text>
  <rect x="222" y="270" width="56" height="56" rx="5" fill="#54237E" stroke="#2E3D70"/>
  <text x="250" y="302" text-anchor="middle" class="mono" font-size="12" fill="#E6EDF7">0.08</text>
  <rect x="282" y="270" width="56" height="56" rx="5" fill="#171E40" stroke="#2E3D70"/>
