  <text x="220" y="436" text-anchor="middle" class="mono" font-size="12" fill="#5F6B8A">E = 2.4 GeV · L = 1.5 m · values in GeV</text>
  <!-- panel: resolved -->
  <rect x="420" y="100" width="360" height="360" rx="14" fill="#111933" stroke="#22305A"/>
  <circle cx="444" cy="127" r="4" fill="#FFD166"/>
  <text x="456" y="132" class="sans" font-size="16" font-weight="600" fill="#E6EDF7">Resolved π⁰ · lower energy</text>
  <rect x="482" y="150" width="56" height="56" rx="5" fill="#FFD166" stroke="#2E3D70"/>
  <text x="510" y="182" text-anchor="middle" class="mono" font-size="12" fill="#1A1030">0.53</text>
  <rect x="542" y="150" width="56" height="56" rx="5" fill="#54237E" stroke="#2E3D70"/>
  <rect x="602" y="150" width="56" height="56" rx="5" fill="#171E40" stroke="#2E3D70"/>
