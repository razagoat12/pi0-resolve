<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Simulation and analysis pipeline</title>
  <desc id="d">A single config file feeds eight modules: generator, decay, transport, detector, reconstruction, dataset, machine learning and analysis. Validation checks guard every stage.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C9D4F0" opacity="0.06"/>
    </pattern>
    <linearGradient id="cfg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0.16"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7BA0"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .node { fill: #111933; stroke: #26335E; }
    .num  { font-size: 12px; letter-spacing: 1px; }
    .name { font-size: 17px; font-weight: 700; fill: #E6EDF7; }
    .desc { font-size: 13px; fill: #8A97B4; }
    .flow { stroke: #6E7BA0; stroke-width: 1.6; fill: none; }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="469" rx="16" fill="#0C1226" stroke="#1F2A4A"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="16" fill="url(#dots)"/>

  <!-- config bar -->
  <rect x="60" y="28" width="1080" height="44" rx="10" fill="url(#cfg)" stroke="#3B4C85"/>
  <text x="80" y="56" class="mono" font-size="14" font-weight="700" fill="#8FDDF7">configs/*.yaml</text>
  <text x="222" y="56" class="sans" font-size="14" fill="#B8C3DD">one source of truth: geometry · resolution · shower model · target · random seeds</text>
  <g stroke="#3B4C85" stroke-dasharray="3 4">
    <line x1="180" y1="72" x2="180" y2="110"/>
    <line x1="460" y1="72" x2="460" y2="110"/>
    <line x1="740" y1="72" x2="740" y2="110"/>
    <line x1="1020" y1="72" x2="1020" y2="110"/>
  </g>

  <!-- row 1: simulate -->
  <rect class="node" x="60"  y="110" width="240" height="90" rx="12"/>
  <rect x="60" y="110" width="4" height="90" rx="2" fill="#4CC9F0"/>
  <text x="80" y="136" class="mono num" fill="#4CC9F0">01 · SIMULATE</text>
  <text x="80" y="162" class="mono name">generator</text>
  <text x="80" y="184" class="sans desc">π⁰ and γ energies, angles, vertex</text>

  <rect class="node" x="340" y="110" width="240" height="90" rx="12"/>
  <rect x="340" y="110" width="4" height="90" rx="2" fill="#4CC9F0"/>
  <text x="360" y="136" class="mono num" fill="#4CC9F0">02 · SIMULATE</text>
  <text x="360" y="162" class="mono name">decay</text>
  <text x="360" y="184" class="sans desc">π⁰ → γγ, Lorentz boost to lab</text>

  <rect class="node" x="620" y="110" width="240" height="90" rx="12"/>
  <rect x="620" y="110" width="4" height="90" rx="2" fill="#4CC9F0"/>
  <text x="640" y="136" class="mono num" fill="#4CC9F0">03 · SIMULATE</text>
  <text x="640" y="162" class="mono name">transport</text>
  <text x="640" y="184" class="sans desc">target conversion, flight to array</text>

  <rect class="node" x="900" y="110" width="240" height="90" rx="12"/>
  <rect x="900" y="110" width="4" height="90" rx="2" fill="#4CC9F0"/>
  <text x="920" y="136" class="mono num" fill="#4CC9F0">04 · SIMULATE</text>
  <text x="920" y="162" class="mono name">detector</text>
  <text x="920" y="184" class="sans desc">shower sharing, σE, noise, gains</text>

  <line class="flow" x1="300" y1="155" x2="336" y2="155" marker-end="url(#arrow)"/>
  <line class="flow" x1="580" y1="155" x2="616" y2="155" marker-end="url(#arrow)"/>
  <line class="flow" x1="860" y1="155" x2="896" y2="155" marker-end="url(#arrow)"/>

  <!-- snake connector -->
  <path class="flow" d="M1140 155 C1176 155 1176 230 1120 230 L 80 230 C 24 230 24 305 56 305" marker-end="url(#arrow)"/>

  <!-- row 2: analyse -->
  <rect class="node" x="60"  y="260" width="240" height="90" rx="12"/>
  <rect x="60" y="260" width="4" height="90" rx="2" fill="#B9A8FF"/>
  <text x="80" y="286" class="mono num" fill="#B9A8FF">05 · RECONSTRUCT</text>
  <text x="80" y="312" class="mono name">reconstruction</text>
  <text x="80" y="334" class="sans desc">clusters, centroids, m(γγ)</text>

  <rect class="node" x="340" y="260" width="240" height="90" rx="12"/>
  <rect x="340" y="260" width="4" height="90" rx="2" fill="#B9A8FF"/>
  <text x="360" y="286" class="mono num" fill="#B9A8FF">06 · RECONSTRUCT</text>
  <text x="360" y="312" class="mono name">dataset</text>
  <text x="360" y="334" class="sans desc">labelled γ vs merged π⁰, E-matched</text>

  <rect class="node" x="620" y="260" width="240" height="90" rx="12"/>
  <rect x="620" y="260" width="4" height="90" rx="2" fill="#FF6FB5"/>
  <text x="640" y="286" class="mono num" fill="#FF6FB5">07 · LEARN</text>
  <text x="640" y="312" class="mono name">ml</text>
  <text x="640" y="334" class="sans desc">width cut → LR → BDT → MLP</text>

  <rect class="node" x="900" y="260" width="240" height="90" rx="12"/>
  <rect x="900" y="260" width="4" height="90" rx="2" fill="#FFD166"/>
  <text x="920" y="286" class="mono num" fill="#FFD166">08 · REPORT</text>
  <text x="920" y="312" class="mono name">analysis</text>
  <text x="920" y="334" class="sans desc">ROC, AUC vs E, robustness</text>

  <line class="flow" x1="300" y1="305" x2="336" y2="305" marker-end="url(#arrow)"/>
  <line class="flow" x1="580" y1="305" x2="616" y2="305" marker-end="url(#arrow)"/>
  <line class="flow" x1="860" y1="305" x2="896" y2="305" marker-end="url(#arrow)"/>

  <!-- validation bar -->
  <rect x="60" y="380" width="1080" height="62" rx="10" fill="#0F2A24" fill-opacity="0.55" stroke="#1F6B55"/>
  <text x="80" y="404" class="mono" font-size="12" letter-spacing="2" fill="#5BE3B0">VALIDATION CHECKS · tests/</text>
  <g class="mono" font-size="13" fill="#BFEFDC">
    <path d="M82 422 l4 4 l8 -9" stroke="#5BE3B0" stroke-width="2" fill="none"/>
    <text x="100" y="429">m(γγ, true) = 134.98 MeV</text>
    <path d="M318 422 l4 4 l8 -9" stroke="#5BE3B0" stroke-width="2" fill="none"/>
    <text x="336" y="429">θmin = 2m/E</text>
    <path d="M462 422 l4 4 l8 -9" stroke="#5BE3B0" stroke-width="2" fill="none"/>
    <text x="480" y="429">P(conv) = 1 − e^(−7x/9X₀)</text>
    <path d="M714 422 l4 4 l8 -9" stroke="#5BE3B0" stroke-width="2" fill="none"/>
    <text x="732" y="429">no smearing → true mass</text>
    <path d="M940 422 l4 4 l8 -9" stroke="#5BE3B0" stroke-width="2" fill="none"/>
    <text x="958" y="429">train ≈ test score</text>
  </g>
</svg>
