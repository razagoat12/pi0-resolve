<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">π⁰ Resolve</title>
  <desc id="d">A hadron beam strikes a target; a neutral pion decays into two photons that land in a 4×4 lead-glass calorimeter, and the two-photon invariant mass forms a peak near 135 MeV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090E1D"/>
      <stop offset="1" stop-color="#131C38"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B5179E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#B5179E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F72585"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="beamIn" gradientUnits="userSpaceOnUse" x1="680" y1="0" x2="764" y2="0">
      <stop offset="0" stop-color="#8A97B4" stop-opacity="0"/>
      <stop offset="1" stop-color="#AEB9D3" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="beamOut" gradientUnits="userSpaceOnUse" x1="776" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#AEB9D3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#AEB9D3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B6788"/>
      <stop offset="1" stop-color="#9AA6C4"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#F72585"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C9D4F0" opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="hot" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .photon { stroke-dasharray: 3 9; animation: flow 1.6s linear infinite; }
    .beam   { stroke-dasharray: 10 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .photon, .beam, .pulse { animation: none; } }
  </style>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <circle cx="1105" cy="165" r="230" fill="url(#glowM)"/>
  <circle cx="180" cy="120" r="260" fill="url(#glowC)"/>
  <rect y="396" width="1280" height="4" fill="url(#rule)"/>

  <!-- ===== left: text ===== -->
  <text x="64" y="96" class="mono" font-size="13" letter-spacing="3" fill="#4CC9F0">BEAM OPTIMIZERS  ·  BEAMLINE FOR SCHOOLS FOLLOW-UP</text>
  <text x="60" y="180" class="sans" font-size="84" font-weight="800" fill="#F2F5FC" letter-spacing="-1">
    <tspan fill="url(#titleGrad)">π⁰</tspan> Resolve</text>
  <text x="64" y="222" class="sans" font-size="19.5" fill="#B8C3DD">Monte Carlo simulation and machine learning for</text>
  <text x="64" y="249" class="sans" font-size="19.5" fill="#B8C3DD">neutral-pion reconstruction in a coarse lead-glass calorimeter</text>

  <g class="mono" font-size="13">
    <rect x="64" y="284" width="84" height="30" rx="15" fill="#F72585" fill-opacity="0.12" stroke="#F72585" stroke-opacity="0.55"/>
    <text x="106" y="304" text-anchor="middle" fill="#FF8CC6">π⁰ → γγ</text>
    <rect x="158" y="284" width="184" height="30" rx="15" fill="#FFB703" fill-opacity="0.10" stroke="#FFB703" stroke-opacity="0.5"/>
    <text x="250" y="304" text-anchor="middle" fill="#FFD166">16 lead-glass blocks</text>
    <rect x="352" y="284" width="192" height="30" rx="15" fill="#4CC9F0" fill-opacity="0.10" stroke="#4CC9F0" stroke-opacity="0.5"/>
    <text x="448" y="304" text-anchor="middle" fill="#8FDDF7">Python · scikit-learn</text>
  </g>

  <!-- ===== right: physics graphic ===== -->

  <!-- invariant-mass sparkline -->
  <text x="690" y="44" class="mono" font-size="11" letter-spacing="2" fill="#8A97B4">INVARIANT MASS  m(γγ)</text>
  <line x1="690" y1="123" x2="962" y2="123" stroke="#3A4870" stroke-width="1"/>
  <polyline fill="none" stroke="#F72585" stroke-width="5" opacity="0.35" filter="url(#soft)"
    points="690.0,71.2 695.2,73.5 700.4,75.7 705.6,77.7 710.8,79.7 716.0,81.6 721.2,83.4 726.3,85.0 731.5,86.6 736.7,88.0 741.9,89.0 747.1,89.4 752.3,88.9 757.5,86.9 762.7,83.2 767.9,77.7 773.1,71.0 778.3,62.8 783.5,53.8 788.7,44.5 793.9,35.2 799.1,26.9 804.3,20.5 809.5,17.0 814.7,16.3 819.9,18.3 825.1,22.9 830.3,29.8 835.5,38.7 840.7,49.0 845.9,60.3 851.1,71.8 856.3,82.3 861.5,90.6 866.7,96.4 871.9,99.5 877.1,99.9 882.3,97.7 887.5,93.1 892.7,86.4 897.9,78.0 903.1,68.5 908.3,58.5 913.5,49.1 918.7,41.1 923.9,35.3 929.1,32.1 934.3,31.6 939.5,33.8 944.7,38.7 949.9,46.2 955.1,55.9 960.3,67.4 962.0,73.8"/>
  <polyline fill="none" stroke="#FF6FB5" stroke-width="2" stroke-linejoin="round"
    points="690.0,71.2 695.2,73.5 700.4,75.7 705.6,77.7 710.8,79.7 716.0,81.6 721.2,83.4 726.3,85.0 731.5,86.6 736.7,88.0 741.9,89.0 747.1,89.4 752.3,88.9 757.5,86.9 762.7,83.2 767.9,77.7 773.1,71.0 778.3,62.8 783.5,53.8 788.7,44.5 793.9,35.2 799.1,26.9 804.3,20.5 809.5,17.0 814.7,16.3 819.9,18.3 825.1,22.9 830.3,29.8 835.5,38.7 840.7,49.0 845.9,60.3 851.1,71.8 856.3,82.3 861.5,90.6 866.7,96.4 871.9,99.5 877.1,99.9 882.3,97.7 887.5,93.1 892.7,86.4 897.9,78.0 903.1,68.5 908.3,58.5 913.5,49.1 918.7,41.1 923.9,35.3 929.1,32.1 934.3,31.6 939.5,33.8 944.7,38.7 949.9,46.2 955.1,55.9 960.3,67.4 962.0,73.8"/>
  <line x1="788.7" y1="56" x2="788.7" y2="128" stroke="#FFD166" stroke-width="1" stroke-dasharray="2 3" opacity="0.8"/>
  <text x="788.7" y="142" text-anchor="middle" class="mono" font-size="11" fill="#FFD166">135 MeV</text>

  <!-- beam (passes beneath the off-axis array) -->
  <line x1="680" y1="300" x2="764" y2="300" stroke="url(#beamIn)" stroke-width="3" class="beam"/>
  <line x1="776" y1="300" x2="1280" y2="300" stroke="url(#beamOut)" stroke-width="2" class="beam"/>
  <text x="684" y="324" class="mono" font-size="11" fill="#8A97B4">π⁺/p beam</text>
  <text x="1262" y="324" text-anchor="end" class="mono" font-size="11" fill="#5F6B8A">to dump →</text>

  <!-- target -->
  <rect x="764" y="268" width="12" height="64" rx="2" fill="url(#targetGrad)"/>
  <text x="770" y="350" text-anchor="middle" class="mono" font-size="11" fill="#8A97B4">target</text>

  <!-- pi0 vertex -->
  <circle cx="790" cy="296" r="9" fill="#F72585" opacity="0.5" filter="url(#soft)" class="pulse"/>
  <circle cx="790" cy="296" r="3.5" fill="#FF6FB5"/>
  <text x="800" y="320" class="sans" font-size="15" font-weight="600" fill="#FF8CC6">π⁰</text>

  <!-- photons -->
  <line x1="790" y1="296" x2="1080" y2="92" stroke="#4CC9F0" stroke-width="6" opacity="0.18" filter="url(#soft)"/>
  <line x1="790" y1="296" x2="1128" y2="236" stroke="#4CC9F0" stroke-width="6" opacity="0.18" filter="url(#soft)"/>
  <line x1="790" y1="296" x2="1080" y2="92" stroke="#8FDDF7" stroke-width="2.2" stroke-linecap="round" class="photon"/>
  <line x1="790" y1="296" x2="1128" y2="236" stroke="#8FDDF7" stroke-width="2.2" stroke-linecap="round" class="photon"/>
  <text x="916" y="190" class="sans" font-size="16" font-style="italic" fill="#8FDDF7">γ</text>
  <text x="950" y="285" class="sans" font-size="16" font-style="italic" fill="#8FDDF7">γ</text>

  <!-- calorimeter: back face for depth -->
  <text x="1010" y="40" class="mono" font-size="11" letter-spacing="2" fill="#8A97B4">LEAD-GLASS ARRAY · 4×4</text>
  <g stroke="#2E3B63" stroke-width="1" fill="none">
    <rect x="1024" y="56" width="188" height="188" rx="4"/>
    <line x1="1010" y1="70" x2="1024" y2="56"/>
    <line x1="1198" y1="70" x2="1212" y2="56"/>
    <line x1="1198" y1="258" x2="1212" y2="244"/>
  </g>

  <!-- hot-block glow -->
  <rect x="1058" y="70" width="44" height="44" rx="4" fill="#FFB703" opacity="0.55" filter="url(#hot)" class="pulse"/>
  <rect x="1106" y="214" width="44" height="44" rx="4" fill="#F76B15" opacity="0.5" filter="url(#hot)" class="pulse"/>

  <!-- 4x4 blocks (colour = simulated energy share) -->
  <g stroke="#33437A" stroke-width="1">
    <rect x="1010" y="70"  width="44" height="44" rx="4" fill="#442577"/>
    <rect x="1058" y="70"  width="44" height="44" rx="4" fill="#FFD166"/>
    <rect x="1106" y="70"  width="44" height="44" rx="4" fill="#442577"/>
    <rect x="1154" y="70"  width="44" height="44" rx="4" fill="#161E3D"/>
    <rect x="1010" y="118" width="44" height="44" rx="4" fill="#282665"/>
    <rect x="1058" y="118" width="44" height="44" rx="4" fill="#55237F"/>
    <rect x="1106" y="118" width="44" height="44" rx="4" fill="#292666"/>
    <rect x="1154" y="118" width="44" height="44" rx="4" fill="#161E3D"/>
    <rect x="1010" y="166" width="44" height="44" rx="4" fill="#161E3B"/>
    <rect x="1058" y="166" width="44" height="44" rx="4" fill="#212254"/>
    <rect x="1106" y="166" width="44" height="44" rx="4" fill="#492479"/>
    <rect x="1154" y="166" width="44" height="44" rx="4" fill="#2D276C"/>
    <rect x="1010" y="214" width="44" height="44" rx="4" fill="#151D3A"/>
    <rect x="1058" y="214" width="44" height="44" rx="4" fill="#2C276B"/>
    <rect x="1106" y="214" width="44" height="44" rx="4" fill="#FCA946"/>
    <rect x="1154" y="214" width="44" height="44" rx="4" fill="#652287"/>
  </g>
  <circle cx="1080" cy="92" r="3" fill="#FFFFFF"/>
  <circle cx="1128" cy="236" r="3" fill="#FFFFFF"/>
</svg>